# The documentation site: https://clang-retro.github.io/win16-sdk/
# Build it with `pip install -r .docs/requirements.txt` and `mkdocs serve`.
INHERIT: .docs/base.yml
site_name: 16-bit Windows SDK
site_description: Windows 1.x, 2.x and 3.x programs and DLLs with clang
site_url: https://clang-retro.github.io/win16-sdk/
repo_url: https://github.com/clang-retro/win16-sdk
repo_name: clang-retro/win16-sdk
edit_uri: ""
hooks:
  - .docs/hooks.py

extra:
  retro:
    github: clang-retro/win16-sdk
    branch: main
    pages:
      README.md: index.md
      README.md#headers: headers.md
      NOTICE.md: redistributing.md
      CONTRIBUTING.md: contributing.md

nav:
  - "Home": index.md
  - "Using the SDK": using.md
  - "Windows versions": versions.md
  - "Headers": headers.md
  - "Building the libraries": building.md
  - "Tests and CI": tests.md
  - "Redistributing": redistributing.md
  - "Contributing": contributing.md
  - "License": license.md
  - "All clang-retro projects": https://clang-retro.github.io/
